services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: dopa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dopa}
      POSTGRES_DB: dopa
    volumes:
      - dopa-pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dopa -d dopa"]
      interval: 5s
      timeout: 3s
      retries: 12

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://dopa:${POSTGRES_PASSWORD:-dopa}@db:5432/dopa
      BRIDGE_SECRET: ${BRIDGE_SECRET:?set BRIDGE_SECRET in .env}
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      OWNER_PIN: ${OWNER_PIN:-}
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - dopa-uploads:/app/public/uploads

volumes:
  dopa-pgdata:
  dopa-uploads:
